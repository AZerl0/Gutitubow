name: Gutitubow
version: '1.0.0-SNAPSHOT'
main: com.azerl0.gutitubow.Gutitubow
api-version: '1.21'
authors: [ AZer0 ]
depend: [NBTAPI, Citizens]
commands:
  ability:
    description: Ability command
    usage: /ability
    permission: gutitubow.ability

  carepackage:
    description: Care package command
    usage: /carepackage
    permission: gutitubow.carepackage
    aliases: [cpack, care]

  game:
    description: Gutitubow game command
    usage: /game
    permission: gutitubow.game

  gameplayer:
    description: Gutitubow game player command
    usage: /gameplayer
    permission: gutitubow.gameplayer
    aliases: [gplayer, gp]

  gutitubowdebug:
    description: Gutitubow debug command
    usage: /gutitubowdebug
    permission: gutitubow.gutitubowdebug
    aliases: [gdebug]

  gutitubowitem:
    description: Gutitubow item command
    usage: /gutitubowitem
    permission: gutitubow.gutitubowitem
    aliases: [gitem, gi]

  gameteam:
    description: Game team command
    usage: /gameteam
    permission: gutitubow.gameteam
    aliases: [gt, gteam]

  setskin:
    description: Set skin command
    usage: /setskin <target> <skinPlayer>
    permission: gutitubow.setskin

  setname:
    description: Set name command
    usage: /setname <target> <name>
    permission: gutitubow.setname

  fakeplayer:
    description: Fake player command
    usage: /fakeplayer ...
    permission: gutitubow.fakeplayer